# Model registry. Add a model by appending an entry; no code changes needed.
#   validate_with : small SAME-ARCHITECTURE model used for probe validation
#                   (L1/L3 test the probe, which is architecture- but not
#                    size-dependent -- avoids loading a 70B model 4x).
#   quant_every   : run the expensive quantization sweep every N decode steps.
#                   Cheap sensitivity stats still run every step.
#   norm_correct  : vLLM's 'nc'. Set false to run the ablation -- it trades
#                   shrinkage for variance, and M3 says that trade is wrong
#                   for an index.
#   native_ctx    : the model's TRUE RoPE window (max_position_embeddings),
#                   read from each live config and verified against this file at
#                   runtime. `ctx` is the DEFAULT this project measures at, which
#                   is not the same thing: qwen3-30b-a3b-2507 declares ctx 131072
#                   but its window is 262144, and qwen3-1.7b declares 8192 against
#                   40960. The ctx guard in the submit scripts caps SIEVE_CTX at
#                   native_ctx, not at ctx -- running past the window measures
#                   untrained positions, but running past the DEFAULT is just a
#                   longer measurement. R4 needs exactly that headroom
#                   (ROADMAP.md: is the 64k->128k collapse a RoPE artifact?).
#   evictors      : WHO the eviction corner is. Names from sievelib/evict.py:
#                   oracle (current-step a*||v-o||, the UPPER BOUND -- keep it,
#                   it is the bound gain_best/err_evict are defined against),
#                   last_step (TOVA), accum (H2O), window (SnapKV), recency
#                   (StreamingLLM, the floor). Options as name:k=v,k=v and an
#                   optional @alias. Paper names work as aliases. The VERDICT
#                   keys off the practical ones; the oracle is reported beside
#                   them. Each corner costs one cumulative pass per (head,
#                   budget) and holds ctx*4 B per (layer, head) of CPU state --
#                   `window` holds that times its `window`, so drop it first if
#                   a large model runs the host out of RAM.
#   corner_policies : HOW MUCH the corner may keep. frac = B*L/maxb (the
#                   literature's definition, linear in L); abs = capped at
#                   max(corner_kappa*n95, corner_floor), i.e. a multiple of the
#                   head's own support. Both -> both are measured, and
#                   corner_bits_used<B>_<policy> records what each spent.
#   kstar         : the policy-free slack diagnostic. Smallest kept-token count
#                   within kstar_tol of the full-budget corner. Nearly free --
#                   it rides the same cumulative pass.
#   corner_in_filename : put the corner fingerprint INTO the parquet name, e.g.
#                   h0_qwen3-8b_40960__or-la-ac-wi-re_fa.parquet. Off by default
#                   (it changes every filename). Turn it on when one results dir
#                   holds several corner configurations -- without it, two configs
#                   of the same model at the same ctx collide on one filename.
#                   The full effective config is ALWAYS written to a .json sidecar
#                   beside each parquet regardless of this setting.
defaults:
  ctx: 131072
  n_prompts: 6
  n_decode: 8
  families:
  - niah
  - qa
  - cont
  dtype: bfloat16
  chunk: 4096
  device_map: auto
  bit_list:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 8
  budgets:
  - 1
  - 2
  - 3
  - 4
  quant_every: 4
  norm_correct: true
  rot_seed: 0
  maxb: 8
  # LEAN BY DEFAULT since R3. The five-corner set cost 28 B per
  # (layer, head, token) of host RAM -- 18.8 GB for llama33-70b at 128k -- and
  # bugs/2/report.md 6.4 measured `window` and `recency` winning only 6-22% and
  # 1-12% of heads for 18 of those 28 bytes. `accum` (H2O) wins 74-93%, so the
  # min-over-corners verdict is barely weaker without them. Dropping them takes
  # the state to 5 B/slot (3.4 GB for the 70B) and is what pays for R3's extra
  # interior allocation -- the five-corner default plus that interior is what
  # overran --time and lost qwen3-8b from the R3 campaign.
  # Put them back explicitly (SIEVE_EVICTORS) if a run needs the full grid.
  evictors:
  - oracle
  - accum
  # `abs` was E1's hypothesis and E1 REFUTED it: K* is 100% of the budget in
  # 24/24 runs, and kappa=4 costs 1.9-7.4x the error. Keeping it as a default
  # spends columns and reader attention on a policy the project has retired.
  corner_policies:
  - frac
  corner_kappa: 4.0
  corner_floor: 256
  kstar: true
  # R3 / E2b: the lagged score the ALLOCATOR also runs on, so the interior and
  # the corner decide from the same information. `accum` (H2O) wins 74-93% of
  # corners, so it is the score a deployable system would carry. Each entry
  # costs one waterfill + one exact_error per (head, budget); [] disables.
  #
  # DELIBERATELY NOT SET HERE -- the default is CornerSpec.interior_scores
  # (= [accum], the same value). A key in this file is indistinguishable from an
  # explicit request once merged, so spelling it out made _parse_interior treat
  # the default as EXPLICIT: any run that changed the evictors without also
  # setting SIEVE_INTERIOR_SCORES (the lag sweep, SIEVE_EVICTORS=oracle) died with
  # "interior_scores ['accum'] are not practical evictors in this run". Left
  # unset, a default naming an absent evictor is dropped, as evict.py intends.
  # Set it per model or with SIEVE_INTERIOR_SCORES to request a score explicitly.
  # interior_scores:
  # - accum
  interior_rank_corner: true
  corner_in_filename: false
