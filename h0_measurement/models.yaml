- tag: qwen3-1.7b
  native_ctx: 40960
  id: Qwen/Qwen3-1.7B
  tier: debug
  ctx: 8192
  n_prompts: 2
  n_decode: 2
  chunk: 2048
  validate_with: Qwen/Qwen3-0.6B
  quant_every: 1
- tag: qwen3-8b
  native_ctx: 40960
  id: Qwen/Qwen3-8B
  tier: main
  ctx: 40960
  validate_with: Qwen/Qwen3-0.6B
- tag: llama31-8b
  native_ctx: 131072
